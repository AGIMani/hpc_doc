# ============================================================================
#  Tensei A100 集群文档站配置
#  本地预览：  mkdocs serve
#  构建产物：  mkdocs build      ->  site/
#  发布到 Pages：mkdocs gh-deploy --force
# ============================================================================

site_name: Tensei A100 集群使用与管理文档
site_description: 八卡 A100 服务器的 GPU 任务提交、节点访问与集群管理指南
site_author: xiaoxu03

# >>> 部署前必改：换成你实际的线上地址（影响搜索、分享卡片与 canonical 链接）
site_url: https://your-org.github.io/tensei-server-doc/

# >>> 部署前必改：换成你实际的代码仓库地址（右上角图标与「编辑此页」链接）
repo_url: https://github.com/your-org/tensei-server-doc
repo_name: your-org/tensei-server-doc
edit_uri: edit/main/docs/

copyright: Copyright &copy; xiaoxu03

nav:
  - 概述: index.md
  - 用户指南:
      - 快速开始: user/quickstart.md
      - 访问集群: user/access.md
      - 使用须知: user/basis.md
      - Slurm 任务调度: user/slurm.md
      - GPU 训练实战: user/gpu-training.md
      - Python 环境管理: user/uv.md
      - 用量查询: user/monitor.md
      - 常见问题: user/faq.md
  - 管理员手册:
      - 总览与规划: admin/index.md
      - 部署 Slurm 集群: admin/slurm-deploy.md
      - 调度策略与配额: admin/policy.md
      - 记账与用量统计: admin/accounting.md
      - 监控与可视化: admin/monitoring.md
      - 用户与账号管理: admin/users.md
      - 访问入口与安全加固: admin/access-security.md
      - 备份、扩容与日常运维: admin/ops.md

theme:
  name: material
  language: zh
  custom_dir: docs/overrides

  # 关闭 Google Fonts 外链。
  # 默认会从 fonts.googleapis.com / fonts.gstatic.com 加载 Roboto，
  # 这两个域名在国内不可达，会让页面卡在字体请求上；
  # 而且 Roboto 没有中文字形，中文本来就是走系统字体回退的，
  # 关掉之后中文显示完全不变，只少了两个境外请求。
  # 字体栈在 docs/assets/extra.css 里用系统字体重新定义。
  font: false

  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: 切换到浅色模式

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/tensei-server-doc
      name: 文档仓库

extra_css:
  - assets/extra.css

# Material 默认在页面出现 .mermaid 图时，从 unpkg.com 动态拉取 mermaid。
# 国内 unpkg 不可达，纯内网部署更是完全没有外网 —— 两种情况都会让
# 全部架构图静默失效。这里改成加载仓库内自带的副本。
# Material 会检测到全局 mermaid 已存在，从而跳过 CDN 请求。
# 文件：docs/assets/javascripts/mermaid.min.js（mermaid v11，gzip 后约 950 KB）
extra_javascript:
  - assets/javascripts/mermaid.min.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 关键：默认 slugify 会把中文标题整体丢掉，生成 _1 / _2 这样的锚点。
      # 换成 pymdownx 的 Unicode slugify，中文标题才能得到可读、可引用的锚点。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - zh
        - en
  # 注意：这里刻意不启用 mkdocs-add-number-plugin。
  # 它会把标题 id 替换成序号（#1、#4-srun-pty 之类），
  # 导致文档内所有「页面#小节」形式的交叉引用全部失效，
  # 而且每次增删小节都要重新编号。稳定可读的锚点更重要。
  # 页脚显示作者与最后更新时间（需要 docs/ 位于 git 仓库中）
  - git-authors:
      show_contribution: true
      show_line_count: false
