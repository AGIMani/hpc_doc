# ============================================================================
#  Tensei A100 集群文档站配置
#  本地预览：  mkdocs serve
#  构建产物：  mkdocs build      ->  site/
#  发布到 Pages：mkdocs gh-deploy --force
# ============================================================================

site_name: Tensei A100 集群使用与管理文档
site_description: 八卡 A100 服务器的 GPU 任务提交、节点访问与集群管理指南
site_author: Tensei Cluster Admin

# >>> 部署前必改：换成你实际的线上地址（影响搜索、分享卡片与 canonical 链接）
site_url: https://your-org.github.io/tensei-server-doc/

# >>> 部署前必改：换成你实际的代码仓库地址（右上角图标与「编辑此页」链接）
repo_url: https://github.com/your-org/tensei-server-doc
repo_name: your-org/tensei-server-doc
edit_uri: edit/main/docs/

copyright: Copyright &copy; Tensei Cluster

nav:
  - 概述: index.md
  - 用户指南:
      - 快速开始: user/quickstart.md
      - 访问集群: user/access.md
      - 使用须知: user/basis.md
      - Slurm 任务调度: user/slurm.md
      - GPU 训练实战: user/gpu-training.md
      - Python 环境管理: user/conda.md
      - 用量查询与监控: user/monitor.md
      - 常见问题: user/faq.md
  - 管理员手册:
      - 总览与规划: admin/index.md
      - 部署 Slurm 集群: admin/slurm-deploy.md
      - 调度策略与配额: admin/policy.md
      - 记账与用量统计: admin/accounting.md
      - 监控与可视化: admin/monitoring.md
      - 用户与账号管理: admin/users.md
      - 访问入口与安全加固: admin/access-security.md
      - 备份、扩容与日常运维: admin/ops.md
  - 部署本文档站: deploy.md

theme:
  name: material
  language: zh
  custom_dir: docs/overrides

  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: 切换到浅色模式

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/tensei-server-doc
      name: 文档仓库

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - zh
        - en
  # 自动为标题编号（同级小节 1. 2. 3. ...）
  - add-number:
      strict_mode: False
      order: 2
  # 页脚显示作者与最后更新时间（需要 docs/ 位于 git 仓库中）
  - git-authors:
      show_contribution: true
      show_line_count: false
      fallback_to_git: true
